[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csvsplit-cli"
version = "1.0.0"
description = "Split a large CSV file into smaller files by row count, preserving the header row, with no dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "sidcore-dev" }]
keywords = ["csv", "split", "cli", "devtools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Utilities",
]

[project.scripts]
csvsplit-cli = "csvsplit_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
